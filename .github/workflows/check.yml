name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Offline plugin contract check
        run: node scripts/check.mjs
